<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080d18">
  <title>Acesso · A.T.L.A.S.</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:#080d18;color:#e8eefb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 5%,#142a49 0,transparent 42%),#080d18}.card{width:min(420px,calc(100% - 32px));padding:32px;border:1px solid #233650;border-radius:20px;background:#0d1726}.brand{text-align:center}.brand img{display:block;width:min(230px,100%);height:auto;max-height:76px;object-fit:contain;margin:auto}h1{font-size:22px;text-align:center;margin:24px 0 8px}p{color:#91a2bd;line-height:1.6;font-size:14px}label{display:block;margin:22px 0 8px;font-size:13px;color:#b9cbe3}input{width:100%;border:1px solid #2b405d;border-radius:10px;padding:13px;background:#08111e;color:white;font:inherit}button{width:100%;margin-top:18px;min-height:46px;border:0;border-radius:10px;background:linear-gradient(135deg,#8acaff,#4d9fff);font-weight:700;cursor:pointer}.error{color:#ffb5b5;min-height:24px}.help{font-size:12px;color:#71839e}
  </style>
</head>
<body><main class="card"><div class="brand"><img src="/assets/Logotipo.png" alt="A.T.L.A.S." width="2172" height="724"></div><h1>Acesso do proprietário</h1><p>Entre com sua senha mestra para acessar suas conversas e memória.</p><form id="login"><label for="password">Senha mestra</label><input id="password" type="password" minlength="14" maxlength="1024" autocomplete="current-password" required><label for="label">Nome deste dispositivo</label><input id="label" maxlength="80" autocomplete="off" value="Navegador local"><button id="submit" type="submit">Entrar</button><p id="error" class="error" role="alert"></p></form><p id="setup" class="help" hidden></p></main>
<script>
let csrfToken="";
async function loadCsrf(){const response=await fetch("/api/auth/csrf");const data=await response.json();csrfToken=data.csrf_token}
document.getElementById("login").addEventListener("submit",async(event)=>{event.preventDefault();const button=document.getElementById("submit");const error=document.getElementById("error");button.disabled=true;error.textContent="";try{if(!csrfToken)await loadCsrf();const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify({password:document.getElementById("password").value,device_label:document.getElementById("label").value||"Dispositivo local"})});if(!response.ok){const data=await response.json();throw new Error(data.detail||"Não foi possível autenticar.")}location.replace("/app")}catch(e){error.textContent=e.message}finally{button.disabled=false}});
(async()=>{try{await loadCsrf();const response=await fetch("/api/auth/status");const data=await response.json();if(!data.owner_configured){const setup=document.getElementById("setup");setup.hidden=false;setup.textContent="Primeiro acesso: configure a senha no terminal local com python -m backend.app.auth_cli create-owner e recarregue esta página."}}catch(_){document.getElementById("error").textContent="Não foi possível conectar ao serviço local."}})();
</script></body></html>
